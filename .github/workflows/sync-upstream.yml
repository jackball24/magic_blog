name: 🔄 Sync Upstream

on:
  schedule:
    - cron: '0 2 * * 1'     # 每周一凌晨2点检查
  workflow_dispatch:          # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/MmzMing/my-blog.git
          git fetch upstream

      - name: Check for updates
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Upstream is $BEHIND commits ahead"

      - name: Fast-forward merge (no conflicts)
        if: steps.check.outputs.behind != '0'
        id: ff
        run: |
          if git merge --ff-only upstream/master; then
            git push origin master
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✅ Fast-forward succeeded"
          else
            echo "result=need_pr" >> $GITHUB_OUTPUT
            echo "⚠️ Need PR for conflicts"
          fi

      - name: Create PR for conflicts
        if: steps.check.outputs.behind != '0' && steps.ff.outputs.result == 'need_pr'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="sync/upstream-${TIMESTAMP}"
          git checkout -b "$BRANCH"
          git merge upstream/master --no-edit || true
          git add -A
          git commit -m "🔄 sync: upstream update ${TIMESTAMP}" || true
          git push origin "$BRANCH"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "🔄 Sync upstream (${TIMESTAMP})" \
            --body "上游 MmzMing/my-blog 有更新，请审查后合并。合并后记得同步到 \`custom\` 分支：
            \`\`\`bash
            git checkout custom
            git merge master
            \`\`\`"